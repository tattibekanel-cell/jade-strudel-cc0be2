<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Қыз ұзату | Анель</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;1,400&family=Noto+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf6f1;--rose:#ecd3cd;--pow:#e4c3bd;--gold:#b89a6a;--ink:#5a4540;--soft:#8a7068;--serif:'Noto Serif',Georgia,serif;--sans:'Noto Sans',system-ui,sans-serif;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}html,body{min-height:100%}
body{background:linear-gradient(180deg,#fbf6f1,#f6e6e0);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;max-width:520px;margin:0 auto;display:flex;justify-content:space-between;padding:12px 16px;z-index:20;pointer-events:none}
.top button{pointer-events:auto}
.chip{border:1px solid var(--gold);background:rgba(251,246,241,.85);backdrop-filter:blur(6px);color:var(--ink);border-radius:20px;padding:6px 14px;font:400 13px var(--sans);cursor:pointer}
.v{display:none;min-height:100vh;flex-direction:column;align-items:center;text-align:center;padding:64px 26px 36px}
.v.on{display:flex;animation:in .8s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1,h2,.name{font-family:var(--serif);font-weight:400}
.name{font-style:italic;font-size:56px;line-height:1.1;color:var(--ink)}
.kz{letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--gold)}
.btn{margin-top:22px;border:1px solid var(--gold);background:var(--ink);color:#fbf6f1;border-radius:30px;padding:14px 34px;font:400 15px var(--sans);letter-spacing:.04em;cursor:pointer;text-decoration:none;display:inline-block}
.btn.o{background:transparent;color:var(--ink)}
.arch{width:78%;max-width:300px;aspect-ratio:3/4;border-radius:200px 200px 16px 16px;overflow:hidden;box-shadow:0 18px 40px rgba(120,80,70,.18);margin:6px 0 22px;border:6px solid #fff8}
.arch img,.full img{width:100%;height:100%;object-fit:cover;display:block}
.p{font-size:16px;margin:0 0 14px;color:var(--ink)}.p.s{font-family:var(--serif);font-size:16.5px}
.nav{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:auto;padding-top:22px;width:100%}
.nav .btn{margin:0;padding:11px 24px;font-size:14px}.prog{font-size:13px;color:var(--soft);min-width:64px}
.orn{width:150px;height:22px;margin:8px auto 14px;display:block}
.full{position:relative;width:calc(100% + 52px);margin:-64px -26px 0;height:56vh;max-height:470px}
.full:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#fbf6f1 100%)}
.p3n{margin-top:-70px;position:relative;z-index:2}.p3n .name{font-size:64px;color:#8a5f55}
.info{background:rgba(255,255,255,.6);border:1px solid var(--pow);border-radius:18px;padding:16px 18px;width:100%;margin-top:6px}
.info div{display:flex;gap:12px;align-items:center;text-align:left;margin:8px 0;font-size:15px}.info svg{flex:none}
.sec{width:100%;padding:34px 0;text-align:center}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.cd div{background:rgba(255,255,255,.65);border:1px solid var(--pow);border-radius:14px;padding:12px 2px}
.cd b{display:block;font:400 28px var(--serif)}.cd span{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
form{text-align:left;margin-top:16px}label{font-size:13px;color:var(--soft);display:block;margin:12px 0 4px}
input[type=text],textarea{width:100%;border:1px solid var(--pow);background:#fffaf6;border-radius:12px;padding:12px;font:400 16px var(--sans);color:var(--ink)}
.opt{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--pow);border-radius:12px;margin:7px 0;background:#fffaf6;font-size:15px;color:var(--ink)}
.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:14px}.ok{background:#eef3e6}.er{background:#f8e1dc}
.fin{border-radius:20px;overflow:hidden}.fin .arch{margin-left:auto;margin-right:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;max-width:86%;display:none;z-index:30;text-align:center}
.sign{font-family:var(--serif);font-style:italic;color:var(--soft);margin-top:20px}
.cv{padding:0!important;position:relative;overflow:hidden;animation:none!important}
.cv .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:58% 50%;opacity:0;animation:cvb 2s ease .1s forwards}
.cv .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(251,240,234,.86),rgba(244,224,217,.74) 50%,rgba(251,240,234,.88))}
.cv .fr{position:absolute;inset:14px;border:1px solid rgba(184,154,106,.8);pointer-events:none;opacity:0;animation:cvb 1.6s ease .6s forwards}
.cv .co{position:absolute;left:24px;bottom:24px;width:62px;height:62px;opacity:0;animation:cvb 1.6s ease 1.2s forwards}
.cc{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:space-between;align-items:center;width:100%;min-height:100vh;min-height:100svh;padding:88px 30px 100px;text-align:center}
.a{opacity:0;animation:cvu 1.4s ease forwards}
.c1{font-size:12px;font-weight:400;letter-spacing:.42em;padding-left:.42em;color:#5a4540}
.c2 h1{font:400 clamp(46px,15vw,76px)/1.05 var(--serif);letter-spacing:.06em;color:#4a3530}
.c2 h1.b{font-size:clamp(28px,9.6vw,48px);letter-spacing:.16em;padding-left:.16em;margin-top:6px}
.c2 .ln{display:block;width:64px;height:1px;background:var(--gold);margin:24px auto 18px}
.c2 p{font:italic 400 clamp(16px,4.6vw,20px)/1.7 var(--serif);color:#5a4540}
.c3{font-size:13px;letter-spacing:.38em;padding-left:.38em;font-weight:400;color:#4a3530;line-height:2.2}
.cb{margin-top:20px;border:1px solid var(--gold);background:rgba(255,250,246,.55);backdrop-filter:blur(4px);color:#4a3530;border-radius:30px;padding:13px 30px 13px 34px;font:400 12px var(--sans);letter-spacing:.34em;cursor:pointer}
.cv.out{animation:cvo .6s ease forwards!important}
.lg{font-size:11px;letter-spacing:.14em;line-height:1.8;color:#5a4540;margin-top:18px}
.lb{display:flex;gap:10px;justify-content:center;margin-top:12px}
.lb .cb{margin:0;letter-spacing:.06em;padding:12px 18px;font-size:14px}
@keyframes cvb{to{opacity:1}}@keyframes cvu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes cvo{to{opacity:0}}
@media (prefers-reduced-motion:reduce){.cv *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body><div id="app"></div><div id="toast"></div><audio id="au" loop preload="none" src="music.mp3"></audio>

p:[["С любовью и трепетом в сердце приглашаем Вас разделить с нами один из самых трогательных и важных дней в жизни нашей семьи — проводы нашей любимой дочери Анель.","Будем счастливы видеть Вас среди дорогих гостей на празднике Қыз ұзату!"],

["С любовью в сердце и благословением родителей начинается новая глава моей жизни.","Буду счастлива разделить этот особенный день с Вами!","Приглашаю Вас на мой Қыз ұзату."],
